config-version: 8
models:
  catalog: ''
  codex-catalog: ''
  devin-catalog: ''
routing:
  strategy: round-robin
  session-affinity: false
  session-affinity-ttl: 1h
  session-affinity-subagents: true
  session-affinity-rebind-on: any
  force-model-prefix: false
  cooldown:
    disable-cooling: false
    save-cooldown-status: false
    transient-error-cooldown-seconds: 0
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
client:
  codex:
    enable-apply-patch: false
    optimize-multi-agent-v2: false
plugins:
  enabled: true
  dir: plugins
  configs:
    account-concurrency:
      enabled: true
      max_per_key: 5
      priority: 1000
    apikeys:
      data-file: /CLIProxyAPI/plugins/apikeys.db
      enabled: true
      priority: 1100
    example:
      enabled: true
      priority: 1
      config1: true
      config2: string
      config3: 3
      mode: safe
      config-list:
      - a
      - b
      config-object:
        mode: safe
    live-routes:
      enabled: true
      inflight_tracking: true
      max_records: 5000
      priority: -100
      retention_minutes: 120
    quota-monitor:
      enabled: true
    usage-report:
      enabled: true
      db_path: /root/.cli-proxy-api/usage-report.sqlite
server:
  max-request-body-bytes: 0
  host: ''
  port: 8317
  github-token: ''
  trusted-proxies: []
  tls:
    enable: false
    cert: ''
    key: ''
  discovery:
    enabled: false
    service-type: _ai-gateway._tcp
    subtypes:
    - _chat-completions
    - _responses
    - _messages
    - _generate-content
    - _interactions
  commercial-mode: false
requests:
  proxy-url: REPLACE_LOCALLY
  tls-handshake-timeout-seconds: 0
  passthrough-headers: false
  nonstream-keepalive-interval: 0
multimedia:
  disable-image-generation: false
  video-result-auth-cache-ttl: 3h
observability:
  logs:
    request-log: false
    debug: false
    logging-to-file: false
    logs-max-total-size-mb: 0
    error-logs-max-files: 10
  pprof:
    enable: false
    addr: 127.0.0.1:8316
  usage:
    usage-statistics-enabled: true
    redis-usage-queue-retention-seconds: 60
upstream:
  claude:
    disable-cloaking-model-list: false
    model-level-cooling: false
    tool-search: false
    disable-claude-cloak-mode: false
  xai:
    inject-x-search: false
  codex:
    disable-codex-cloaking: false
    stream-bootstrap-buffering: false
    stream-bootstrap-timeout: '0'
    orphan-delegation-compatibility: false
    model-level-cooling: false
    response-steering: false
access:
  api-keys:
  - REPLACE_LOCALLY
credentials:
  concurrency:
    cpa-heartbeat-timeout: 3s
    cpa-cancel-bound: 5s
    reclaim-grace: 5s
    cleanup-interval: 5s
    release-flush-interval: 250ms
    release-max-backoff: 2s
    busy-retry-min: 250ms
    busy-retry-max: 1s
    max-limit: 1000000
  in-flight:
    snapshot-interval: 2s
    stale-after: 10s
    max-part-bytes: 262144
    max-part-count: 64
    max-revision-bytes: 16777216
    max-aggregate-groups: 100000
    max-details: 10000
    max-string-bytes: 256
    staging-retention: 1m
management:
  allow-remote: true
  secret-key: REPLACE_LOCALLY
  disable-control-panel: false
  disable-auto-update-panel: true
  panel-github-repository: https://github.com/router-for-me/Cli-Proxy-API-Management-Center
oauth:
  auth-dir: /root/.cli-proxy-api
  providers:
    antigravity:
      antigravity-credits: true
    aistudio:
      ws-auth: true
    codex:
      live-media-relay:
        enabled: false
        max-sessions: 32
        disable-private-remote-ips: false
        public-ip: ''
        udp-port-min: 0
        udp-port-max: 0
      signin-with-chatgpt-identifier: CLIProxyAPI
