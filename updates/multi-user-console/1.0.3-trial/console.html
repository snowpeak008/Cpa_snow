<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow Console · 用户工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b151d;--panel:#101f29;--border:#28414e;--muted:#91a8b5;--fg:#e5eff4;--accent:#84d9bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#19333f;color:var(--fg);border:1px solid #385462;border-radius:8px;padding:9px 16px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#0a2821;border-color:transparent;font-weight:650}button.danger{color:#ffaaa0}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;background:#0b1922;color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:10px}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #447e72}label{display:block;color:var(--muted);margin-top:16px}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:20px}h3{font-size:16px}small,.muted{color:var(--muted)}.badge{display:inline-block;color:var(--accent);background:#153b33;border-radius:5px;padding:3px 8px;font-size:12px}.warning{background:#342c19;border:1px solid #645126;color:#f2d599;border-radius:8px;padding:12px 16px;margin-bottom:28px}.hidden{display:none!important}#login{max-width:440px;margin:13vh auto;padding:30px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:36px;font-weight:700}.logo{display:inline-grid;place-items:center;width:34px;height:34px;background:#193c3b;color:var(--accent);border-radius:10px;font-size:22px}aside{width:220px;position:fixed;inset:0 auto 0 0;background:#0a1219;border-right:1px solid var(--border);padding:28px 18px}aside .brand{font-size:16px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);margin-bottom:8px}nav button.active{background:#18382f;color:#c7ffea}main{margin-left:220px;padding:44px 5vw;max-width:1600px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:28px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 32px}.stat,.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px}.stat strong{font-size:30px;display:block;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card p{color:var(--muted);overflow-wrap:anywhere}.card .row{margin-top:16px}.card button{font-size:12px;padding:6px 10px}.empty{padding:45px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}.toolbar{margin:20px 0}#ownerFilter{max-width:230px}.footer{position:absolute;bottom:24px;left:22px;color:var(--muted);font-size:12px}dialog{background:#101f29;color:var(--fg);border:1px solid #3c5c6a;border-radius:14px;padding:30px;width:min(560px,95vw);max-height:90vh}dialog::backdrop{background:#0009}dialog .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}#notice{position:fixed;right:24px;bottom:20px;background:#254638;border:1px solid #6fbb9a;padding:14px 24px;border-radius:8px;z-index:10;max-width:90vw}pre{white-space:pre-wrap;word-break:break-all;background:#09151d;border-radius:8px;padding:16px;max-height:45vh;overflow:auto}#secretValue{user-select:all}.section-title{margin-bottom:18px}hr{border:0;border-top:1px solid var(--border);margin:22px 0}@media(max-width:850px){aside{position:static;width:auto;border-right:0;border-bottom:1px solid var(--border);padding:16px}.brand{margin-bottom:16px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.footer{display:none}main{margin:0;padding:26px 18px}.stats{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}}
</style></head><body>
<section id="login"><div class="brand"><span class="logo">△</span>Snow Console · 雪峰控制台</div><span class="badge">多用户开发版</span><h1 style="margin-top:20px">登录你的工作台</h1><p class="muted">使用独立的用户名和密码。调用模型使用的 API Key 与后台密码分开管理。</p><form id="loginForm"><label>用户名<input name="username" autocomplete="username" required maxlength="40"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" style="width:100%;margin-top:24px">登录</button></form><p id="loginError" role="alert" style="color:#ffaaa0;margin-top:16px"></p><small>自助注册暂未开放，请联系管理员创建账号。</small></section>
<div id="app" class="hidden"><aside><div class="brand"><span class="logo">△</span>Snow Console</div><nav id="nav"></nav><div class="footer">雪峰控制台<br>资源按用户独立管理</div></aside><main><header><div><small id="identity"></small><h1 id="title" style="margin:8px 0">我的概览</h1><p class="muted" id="subtitle">查看属于你的账号、渠道和 Key。</p></div><div class="row"><button id="reload">刷新</button><button id="passwordBtn">修改密码</button><button id="logout">退出</button></div></header><div class="warning">独立试用版 · 数据保存在独立库，尚未同步到现有 CPA。这里创建的 Key 暂不可调用模型；真实额度与运行统计尚未接入。</div><div id="stats" class="stats"></div><div class="row between toolbar"><div class="row"><select id="ownerFilter" class="hidden"></select><span class="muted" id="count"></span></div><button id="add" class="primary hidden">新增</button></div><div id="content"></div></main></div>
<dialog id="edit"><form id="editForm"><h2 id="editTitle"></h2><div id="fields"></div><p id="editError" role="alert" style="color:#ffaaa0"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="result"><h2 id="resultTitle"></h2><p id="resultDescription" class="muted"></p><pre id="secretValue"></pre><button id="closeResult">关闭</button></dialog><div id="notice" class="hidden" role="status"></div>
<script>
'use strict';let state=null,tab='overview',submit=null,busy=false;const $=id=>document.getElementById(id);
const messages={unauthorized:'请重新登录。',invalid_credentials:'用户名或密码不正确。',try_later:'尝试次数较多，请在 5 分钟后重试。',forbidden:'你没有执行此操作的权限。',key_limit:'已达到管理员设置的 Key 数量限制。',resource_limit:'已达到管理员设置的资源数量限制。',credential_unavailable:'该凭证无法添加，请检查是否已导入。',username_unavailable:'用户名不可用。',password_8_to_256_chars:'密码需为 8 至 256 个字符。',invalid_username:'用户名需为 3 至 40 位字母、数字、下划线、点或连字符。',tokens_required:'认证文件缺少 access_token 或 refresh_token。',unsupported_credential_fields:'认证文件包含暂不支持的字段。',unsupported_account_type:'认证文件的 type 必须与所选类型一致。',stale_revision:'资源已被其他操作修改，请刷新后重试。',assigned_resource_readonly:'管理员分配的资源为只读。',https_base_url_required:'请输入 HTTPS 服务根地址。',invalid_models:'模型名称格式不支持。',invalid_csrf:'会话校验失败，请刷新页面。',account_admin_only:'账号只能由管理员添加、删除或修改凭证。',account_admin_disabled:'管理员已停用此账号，不能自行启用或调权重。',weight_1_to_10:'相对权重需为 1 至 10 的整数。',self_upstream_forbidden:'不能将本服务地址作为上游 API，否则会形成循环。',nonpublic_upstream_forbidden:'上游地址不能指向本机或非公网地址。'};
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function toast(text){$('notice').textContent=text;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),5000)}
async function api(path,body){const opt={credentials:'same-origin',headers:{}};if(body!==undefined){opt.method='POST';opt.headers={'Content-Type':'application/json','X-CSRF-Token':state?.csrf||''};opt.body=JSON.stringify(body)}const r=await fetch('/api/'+path,opt);const data=await r.json();if(!r.ok){if(r.status===401&&path!=='login')showLogin();throw Error(messages[data.error]||('操作失败：'+data.error))}return data}
function showLogin(){state=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('content').replaceChildren();$('stats').replaceChildren();$('edit').close();$('result').close();$('secretValue').textContent=''}
async function load(){state=await api('state');$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}
const labels={overview:'概览',keys:'我的 Key',account:'我的账号',upstream:'上游渠道',users:'用户管理'};
function filtered(rows){const owner=$('ownerFilter').value;return owner?rows.filter(r=>r.owner===owner):rows}
function render(){const admin=state.me.role==='admin';$('identity').textContent=state.me.username+' · '+(admin?'管理员':'普通用户');$('nav').replaceChildren();for(const t of Object.keys(labels)){if(t==='users'&&!admin)continue;const b=node('button',labels[t],tab===t?'active':'');b.onclick=()=>{tab=t;render()};$('nav').append(b)}$('title').textContent=admin&&tab==='overview'?'管理概览':labels[tab];$('subtitle').textContent=admin?'你可以管理全部用户的资源与访问权限。':'仅显示属于你或管理员分配给你的资源。';$('stats').replaceChildren();if(tab==='overview'){const items=[['客户端 Key',state.keys.filter(k=>k.enabled).length],['已导入账号',state.resources.filter(r=>r.kind==='account').length],['上游渠道',state.resources.filter(r=>r.kind==='upstream').length],[admin?'用户数量':'总并发上限',admin?state.users.length:state.limits.max_concurrency]];for(const [label,value]of items){const el=node('div',undefined,'stat');el.append(node('small',label),node('strong',String(value)));$('stats').append(el)}}$('stats').classList.toggle('hidden',tab!=='overview');const previous=$('ownerFilter').value;$('ownerFilter').replaceChildren(new Option('全部用户',''));for(const u of state.users)$('ownerFilter').append(new Option(u.username,u.id));$('ownerFilter').value=state.users.some(u=>u.id===previous)?previous:'';$('ownerFilter').classList.toggle('hidden',!admin||['overview','users'].includes(tab));$('add').classList.toggle('hidden',tab==='overview'||tab==='account'&&!admin);$('add').textContent=tab==='keys'?'创建 Key':tab==='users'?'创建用户':tab==='account'?'导入账号':'添加上游渠道';$('content').replaceChildren();$('count').textContent='';if(tab==='overview'){const c=node('div',undefined,'card');c.append(node('h2','各自管理，权限独立'),node('p','账号由管理员添加和分配；用户可启停、调整相对权重，并管理自己的客户端 Key 与上游 API。所有 Key 使用本人可访问的账号组，不能选择其他用户的资源。'),node('p','额度：尚未接入生产数据。多 Key 的合计并发与美元预算将在调用侧接入后验证。'));if(admin){const b=node('button','查看迁移预览');b.onclick=async()=>{try{showResult('迁移预览','此预览不含凭证，尚不能直接应用到生产。',JSON.stringify(await api('admin/plan'),null,2))}catch(e){toast(e.message)}};c.append(b)}$('content').append(c);return}const rows=tab==='users'?state.users:filtered(tab==='keys'?state.keys:state.resources.filter(r=>r.kind===tab));$('count').textContent=rows.length+' 项';if(!rows.length){$('content').append(node('div',(tab==='account'&&!admin?'暂无分配的账号，请联系管理员。':'暂无内容，使用右侧按钮添加。'),'empty'));return}const grid=node('div',undefined,'grid');for(const r of rows){const c=node('article',undefined,'card');c.append(node('span',tab==='users'?(r.role==='admin'?'管理员':'普通用户'):tab==='keys'?'API Key':r.provider,'badge'),node('h3',r.name||r.username));const user=state.users.find(u=>u.id===r.owner);if(admin&&user)c.append(node('p','归属：'+user.username));if(tab==='users'){c.append(node('p',r.enabled?'已启用':'已停用'),node('p','Key '+r.limits.max_keys+' · 账号 '+r.limits.max_accounts+' · 上游 '+r.limits.max_upstreams+' · 总并发 '+r.limits.max_concurrency));if(r.role!=='admin')c.append(button('设置权限与限额',()=>editUser(r)),button('重设登录密码',()=>resetPassword(r)))}else{c.append(node('p',tab==='keys'?r.masked:(r.base_url||(r.kind==='account'?'管理员分配 · 可启停及调权重':r.writable?'自行添加':'管理员分配 · 只读'))),node('small',r.enabled?'已启用 · 待接入 CPA':'已停用 · 待接入 CPA'));if(r.models)c.append(node('p',r.models.join(' · ')));const actions=node('div',undefined,'row');if(tab==='keys'){if(r.enabled)actions.append(button('撤销',()=>confirmed('撤销这个 Key？',()=>api('keys/revoke',{id:r.id})),true))}else{if(r.controllable)actions.append(button(r.enabled?'停用':'启用',()=>change('resources/toggle',{id:r.id,revision:r.revision,enabled:!r.enabled})));if(r.kind==='account'){c.append(node('p','相对权重：'+r.weight+' / 10'+(r.admin_disabled?' · 管理员已停用':'')));if(r.controllable)actions.append(button('调整权重',()=>editWeight(r)))}if(r.writable){actions.append(button('删除',()=>confirmed('删除这个资源？',()=>api('resources/delete',{id:r.id,revision:r.revision})),true));if(r.kind==='upstream')actions.append(button('编辑',()=>editUpstream(r)));if(admin)actions.append(button('分配用户',()=>assign(r)))}}c.append(actions)}grid.append(c)}$('content').append(grid)}
function button(text,fn,danger=false){const b=node('button',text,danger?'danger':'');b.onclick=async()=>{try{await fn()}catch(e){toast(e.message)}};return b}
async function change(path,body){await api(path,body);await load();toast('已保存到开发库。')}
async function confirmed(text,fn){if(!confirm(text))return;await fn();await load()}
function field(name,label,type='text',value='',options=null){const l=node('label',label);let input;if(type==='select'){input=node('select');for(const [v,text]of options)input.append(new Option(text,v))}else input=node(type==='textarea'?'textarea':'input');input.name=name;if(input.tagName==='INPUT')input.type=type;input.value=value;input.required=true;if(type==='password')input.autocomplete='new-password';l.append(input);$('fields').append(l);return input}
function modal(title,build,fn){$('editTitle').textContent=title;$('fields').replaceChildren();$('editError').textContent='';build();submit=fn;$('edit').showModal()}
function ownerField(){if(state.me.role==='admin')field('owner','所属用户','select',state.me.id,state.users.filter(u=>u.enabled).map(u=>[u.id,u.username]))}
function editUser(u){modal('设置 '+u.username+' 的权限',()=>{field('enabled','访问状态','select',String(u.enabled),[['1','启用'],['0','停用']]);for(const [k,label]of Object.entries({max_keys:'最多可用 Key',max_accounts:'最多分配账号',max_upstreams:'最多上游渠道',max_concurrency:'用户总并发上限（待调用侧接入）'})){const e=field(k,label,'number',u.limits[k]);e.min='0';e.max=k==='max_concurrency'?'100':'1000';e.step='1'}},async d=>{await api('users/update',{id:u.id,enabled:d.enabled==='1',limits:Object.fromEntries(Object.keys(u.limits).map(k=>[k,Number(d[k])]))})})}
function resetPassword(u){modal('重设 '+u.username+' 的登录密码',()=>{field('password','新密码（至少 8 位）','password');$('fields').append(node('p','保存后该用户现有登录会话立即失效。','muted'))},d=>api('users/reset-password',{id:u.id,password:d.password}))}
function editUpstream(r){modal('编辑上游渠道',()=>{field('name','渠道名称','text',r.name);field('base_url','HTTPS 服务根地址','url',r.base_url);const key=field('key','新上游 Key（留空保持原值）','password');key.required=false;field('models','模型名称，每行一个','textarea',r.models.join('\n'))},d=>api('resources/update',{...d,id:r.id,revision:r.revision,kind:r.kind,provider:r.provider,models:d.models.split('\n').map(v=>v.trim()).filter(Boolean)}))}
function editWeight(r){modal('调整账号相对权重',()=>{const w=field('weight','权重（1 至 10）','number',r.weight);w.min='1';w.max='10';w.step='1';$('fields').append(node('p','相对权重用于后续选号；不会强制切换已绑定的对话。当前仍只保存在开发库。','muted'))},d=>api('resources/weight',{id:r.id,revision:r.revision,weight:Number(d.weight)}))}
function assign(r){modal('分配资源',()=>{field('owner','接收用户','select','',state.users.filter(u=>u.enabled&&u.id!==r.owner).map(u=>[u.id,u.username]));$('fields').append(node('p','分配后原用户无法访问；账号接收者可启停和调权重，不能删除、替换凭证或改代理。','muted'))},d=>api('resources/assign',{id:r.id,owner:d.owner}))}
function showResult(title,desc,value){$('resultTitle').textContent=title;$('resultDescription').textContent=desc;$('secretValue').textContent=value;$('result').showModal()}
$('add').onclick=()=>{if(tab==='keys')modal('创建客户端 Key',()=>{ownerField();field('name','Key 名称')},async d=>{const r=await api('keys/create',d);showResult('Key 已创建','仅显示这一次，请自行保存。开发版 Key 尚未接入线上 CPA。',r.key)});else if(tab==='users')modal('创建普通用户',()=>{field('username','用户名');field('password','初始密码（至少 8 位）','password')},d=>api('users/create',d));else if(tab==='account'&&state.me.role!=='admin')toast('账号只能由管理员添加。');else if(tab==='account')modal('导入自己的账号',()=>{ownerField();field('name','显示名称');field('provider','认证类型','select','claude',[['claude','Claude OAuth'],['codex','GPT / Codex OAuth']]);field('credential','认证 JSON（仅粘贴自己的授权文件）','textarea');$('fields').append(node('p','暂支持 type、email、access_token、refresh_token、id_token、account_id、expired、last_refresh。导入不会发起登录或上游请求。','muted'))},d=>api('resources/create',{...d,kind:'account',credential:JSON.parse(d.credential)}));else modal('添加上游渠道',()=>{ownerField();field('name','渠道名称');field('provider','服务类型','select','claude',[['claude','Claude · Messages'],['gpt','GPT · Chat Completions'],['grok','Grok · Chat Completions']]);field('base_url','HTTPS 服务根地址','url');field('key','你有权使用的上游 API Key','password');field('models','模型名称，每行一个','textarea')},d=>api('resources/create',{...d,kind:'upstream',models:d.models.split('\n').map(v=>v.trim()).filter(Boolean)}))};
$('editForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const data=Object.fromEntries(new FormData(e.target));const btn=e.submitter;btn.disabled=true;try{await submit(data);$('edit').close();e.target.reset();if(state)await load();toast('已保存到开发库。')}catch(err){$('editError').textContent=err instanceof SyntaxError?'认证 JSON 格式不正确。':err.message}finally{busy=false;btn.disabled=false}};
$('cancel').onclick=()=>{$('editForm').reset();$('fields').replaceChildren();$('edit').close()};$('edit').addEventListener('close',()=>{$('editForm').reset();$('fields').replaceChildren()});$('closeResult').onclick=()=>$('result').close();$('result').addEventListener('close',()=>$('secretValue').textContent='');$('ownerFilter').onchange=render;$('reload').onclick=()=>load().catch(e=>toast(e.message));$('logout').onclick=async()=>{try{await api('logout',{});showLogin()}catch(e){toast(e.message)}};$('passwordBtn').onclick=()=>modal('修改自己的密码',()=>{field('current','当前密码','password');field('password','新密码（至少 8 位）','password');field('confirm','再次输入新密码','password')},async d=>{if(d.password!==d.confirm)throw Error('两次新密码不一致。');await api('password',d);showLogin();toast('密码已修改，请使用新密码重新登录。')});$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await api('login',Object.fromEntries(new FormData(e.target)));e.target.reset();tab='overview';await load();$('loginError').textContent=''}catch(err){$('loginError').textContent=err.message}finally{btn.disabled=false}};load().catch(()=>{});
</script></body></html>
